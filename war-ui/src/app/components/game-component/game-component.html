@if (!player1.empty() && !player2.empty()) {
<button (click)="flipCards()">Next Round</button>
<p></p>
} @else {
<p>Game over!</p>
}

@if (card1 && card2) {
<div class="card-row">
  <app-card-component
    [suit]="card1.suit"
    [rank]="card1.rank"
    [faceUp]="card1FaceUp">
  </app-card-component>
  <app-card-component
    [suit]="card2.suit"
    [rank]="card2.rank"
    [faceUp]="card2FaceUp">
  </app-card-component>
</div>
}

@if (player1 && player2) {
<p>Player 1 has {{ player1.size() }} cards left.</p>
<p>Player 2 has {{ player2.size() }} cards left.</p>   
}
